name: Client checks

on:
  pull_request:
    paths:
      - "apps/web/**"
      - "apps/mobile/**"
      - ".github/workflows/client-checks.yml"
  push:
    branches:
      - "feat/admin-lalamove-carrier"
    paths:
      - "apps/web/**"
      - "apps/mobile/**"
      - ".github/workflows/client-checks.yml"

jobs:
  web:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    defaults:
      run:
        working-directory: apps/web
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node 22
        uses: actions/setup-node@v4
        with:
          node-version: "22"

      - name: Install Web dependencies
        run: npm install --no-audit --no-fund

      - name: Lint Web
        run: npm run lint

      - name: Build Web
        run: npm run build

  mobile:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    defaults:
      run:
        working-directory: apps/mobile
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node 22
        uses: actions/setup-node@v4
        with:
          node-version: "22"

      - name: Install Mobile dependencies
        run: npm install --no-audit --no-fund

      - name: Lint Mobile
        run: npm run lint

      - name: Typecheck Mobile
        run: npm run typecheck
