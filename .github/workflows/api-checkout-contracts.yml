name: API checkout contracts

on:
  pull_request:
    paths:
      - "apps/api/**"
      - ".github/workflows/api-checkout-contracts.yml"
  push:
    branches:
      - "feat/admin-lalamove-carrier"
    paths:
      - "apps/api/**"
      - ".github/workflows/api-checkout-contracts.yml"

jobs:
  checkout-contracts:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    env:
      DATABASE_URL: mysql://kaitokid:ci@127.0.0.1:3306/kaitokid
      NODE_ENV: test
    defaults:
      run:
        working-directory: apps/api
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node 22
        uses: actions/setup-node@v4
        with:
          node-version: "22"

      - name: Install API dependencies
        run: npm install --no-audit --no-fund

      - name: Build API and run checkout/Lalamove contracts
        run: npm run test:checkout-order
